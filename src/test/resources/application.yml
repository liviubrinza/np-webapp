spring:
  application:
    name: np-webapp
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB
  datasource:
    url: jdbc:h2:mem:np-webapp-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

logging:
  level:
    root: WARN

app:
  storage:
    documents-dir: ./target/test-data/documents
  logging:
    dir: ./target/test-data/logs
  mail:
    enabled: false
    from: "test@example.com"
  demo-data:
    appointments:
      enabled: false
  contact:
    address: "Test Address 1"
    phone: "0700000000"
    email: "test@example.com"
    hours: "09:00 - 17:00"
    latitude: 46.0
    longitude: 23.0
