<!DOCTYPE html>
<html th:lang="${currentLocale}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{nav.home}, #{home.meta.description}, false, ~{})}"></head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>
<div th:replace="~{layout/fragments :: notificationBanner}"></div>

<main class="d-flex flex-column">
    <section class="hero-section">
        <div class="container">
            <div class="hero-panel">
                <h1 th:text="#{home.heading}">Welcome</h1>
                <p class="lead" th:text="#{home.intro}">Professional notary services you can trust.</p>
                <a class="btn btn-primary btn-lg px-4 mt-3" th:href="@{'/' + ${currentLocale} + '/book'}"
                   th:text="#{nav.book}">Book Appointment</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>

<script th:replace="~{layout/fragments :: bootstrapJs}"></script>
</body>
</html>
