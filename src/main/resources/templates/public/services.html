<!DOCTYPE html>
<html th:lang="${currentLocale}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{nav.services}, #{services.meta.description}, false, ~{::#extraHead})}">
    <div id="extraHead" th:remove="tag">
        <script type="application/ld+json" th:inline="javascript">/*[(${servicesJsonLd})]*/{}</script>
    </div>
</head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container my-5">
    <h1 th:text="#{nav.services}">Services</h1>

    <p th:if="${services.isEmpty()}" class="text-muted" th:text="#{services.empty}">
        No services available at the moment.
    </p>

    <div class="row row-cols-1 g-4 mt-2">
        <div class="col" th:each="service : ${services}">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${service.name()}">Service name</h2>
                    <p class="card-text" th:text="${service.description()}">Description</p>
                </div>
                <div class="card-footer text-muted"
                     th:text="${service.durationMinutes()} + ' ' + #{services.minutes}">30 min</div>
            </div>
        </div>
    </div>

    <a class="btn btn-primary btn-lg px-4 mt-4" th:href="@{'/' + ${currentLocale} + '/book'}"
       th:text="#{nav.book}">Book Appointment</a>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
