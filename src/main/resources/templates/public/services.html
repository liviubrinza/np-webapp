<!DOCTYPE html>
<html th:lang="${currentLocale}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(#{nav.services}, #{services.meta.description}, false, ~{::#extraHead})}">
    <div id="extraHead" th:remove="tag">
        <script type="application/ld+json" th:inline="javascript">/*[(${servicesJsonLd})]*/{}</script>
    </div>
</head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>
<div th:replace="~{layout/fragments :: notificationBanner}"></div>

<main class="d-flex flex-column">
    <section class="hero-section">
        <div class="container">
            <div class="page-panel">
                <h1 th:text="#{nav.services}">Services</h1>

                <p class="mt-3">
                    <h5>
                        <strong th:text="#{services.duration.disclaimer.label}">Disclaimer:</strong>
                    </h5>
                    <span th:text="#{services.duration.disclaimer}">The duration shown for each service is an estimate.</span>
                </p>

                <p th:if="${services.isEmpty()}" class="text-muted mt-3" th:text="#{services.empty}">
                    No services available at the moment.
                </p>

                <div class="row row-cols-1 g-4 mt-2">
                    <div class="col" th:each="service : ${services}">
                        <div class="card h-100">
                            <div class="card-header service-card-header">
                                <h2 class="h5 card-title mb-0" th:text="${service.name()}">Service name</h2>
                            </div>
                            <div class="card-body">
                                <p class="card-text mb-0" th:text="${service.description()}">Description</p>
                            </div>
                            <div class="card-footer text-muted"
                                 th:text="${service.durationMinutes()} + ' ' + #{services.minutes}">30 min</div>
                        </div>
                    </div>
                </div>

                <a class="btn btn-primary btn-lg px-4 mt-4" th:href="@{'/' + ${currentLocale} + '/book'}"
                   th:text="#{nav.book}">Book Appointment</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>

<script th:replace="~{layout/fragments :: bootstrapJs}"></script>
</body>
</html>
