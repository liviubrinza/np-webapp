<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head(title, extraHead)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | ' + #{site.title}">Notary Public Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <th:block th:if="${extraHead != null}">
        <th:block th:replace="${extraHead}"></th:block>
    </th:block>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
        <a class="navbar-brand" th:href="@{'/' + ${currentLocale}}" th:text="#{site.title}">Notary Public Office</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{'/' + ${currentLocale}}" th:text="#{nav.home}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{'/' + ${currentLocale} + '/services'}" th:text="#{nav.services}">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{'/' + ${currentLocale} + '/contact'}" th:text="#{nav.contact}">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{'/' + ${currentLocale} + '/book'}" th:text="#{nav.book}">Book Appointment</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${currentLocale == 'en'} ? 'fw-bold text-decoration-underline'"
                       th:href="@{'/en' + ${pathAfterLocale}}" th:text="#{lang.en}">English</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${currentLocale == 'ro'} ? 'fw-bold text-decoration-underline'"
                       th:href="@{'/ro' + ${pathAfterLocale}}" th:text="#{lang.ro}">Romanian</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${currentLocale == 'hu'} ? 'fw-bold text-decoration-underline'"
                       th:href="@{'/hu' + ${pathAfterLocale}}" th:text="#{lang.hu}">Hungarian</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-light text-center py-4 mt-5 border-top">
    <div class="container">
        <span th:text="${T(java.time.Year).now()} + ' ' + #{site.title} + ' — ' + #{footer.rights}">
            2026 Notary Public Office — All rights reserved.
        </span>
    </div>
</footer>

</body>
</html>
