<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Utilizatori Admin', null)}"></head>
<body>

<nav th:replace="~{admin/fragments :: navbar}"></nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Utilizatori Admin</h1>
        <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">Cont nou</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Nume de utilizator</th>
            <th>Rol</th>
            <th>Creat</th>
            <th>Ultima autentificare</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${admins}">
            <td th:text="${a.username()}"></td>
            <td>
                <span th:switch="${a.role().name()}">
                    <span th:case="'ADMIN'" class="badge bg-secondary">ADMIN</span>
                    <span th:case="'TECHNICIAN'" class="badge bg-primary">TECHNICIAN</span>
                    <span th:case="*" th:text="${a.role()}"></span>
                </span>
            </td>
            <td th:text="${#temporals.format(a.createdAt(), 'dd MMM yyyy, HH:mm')}"></td>
            <td th:text="${a.lastLogin() != null} ? ${#temporals.format(a.lastLogin(), 'dd MMM yyyy, HH:mm')} : 'Niciodată'"></td>
            <td class="text-end">
                <a th:href="@{/admin/users/{id}(id=${a.id()})}" class="btn btn-outline-primary btn-sm">Detalii</a>
                <form th:action="@{/admin/users/{id}/delete(id=${a.id()})}" method="post" class="d-inline"
                      onsubmit="return confirm('Ștergeți acest cont?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Șterge</button>
                </form>
            </td>
        </tr>
        <tr th:if="${admins.isEmpty()}">
            <td colspan="5" class="text-muted text-center py-4">Nu există conturi încă.</td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
