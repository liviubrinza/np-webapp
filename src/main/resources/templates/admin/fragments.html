<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<head th:fragment="head(title, extraHead)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | Birou Notarial'">Birou Notarial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <th:block th:if="${extraHead != null}">
        <th:block th:replace="${extraHead}"></th:block>
    </th:block>
</head>

<nav th:fragment="navbar" class="navbar navbar-dark" style="background-color: #66090c;">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}">Panou Admin</a>
        <ul class="navbar-nav flex-row me-auto">
            <li class="nav-item me-3">
                <a class="nav-link text-white" th:href="@{/admin/appointments}">Programări</a>
            </li>
            <li class="nav-item me-3">
                <a class="nav-link text-white" th:href="@{/admin/calendar}">Calendar</a>
            </li>
            <li class="nav-item me-3" sec:authorize="hasRole('TECHNICIAN')">
                <a class="nav-link text-white" th:href="@{/admin/statistics}">Statistici</a>
            </li>
            <li class="nav-item me-3" sec:authorize="hasRole('TECHNICIAN')">
                <a class="nav-link text-white" th:href="@{/admin/users}">Utilizatori Admin</a>
            </li>
        </ul>
        <form th:action="@{/admin/logout}" method="post" class="d-flex align-items-center mb-0">
            <span class="navbar-text text-white me-3" sec:authentication="name">admin</span>
            <a th:href="@{/admin/profile}" class="btn btn-outline-light btn-sm me-2">Profil</a>
            <button type="submit" class="btn btn-outline-light btn-sm">Deconectare</button>
        </form>
    </div>
</nav>

<ul th:fragment="statisticsNav(active)" class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link" th:classappend="${active == 'requests'} ? 'active'"
           th:href="@{/admin/statistics}">Cereri</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:classappend="${active == 'traffic'} ? 'active'"
           th:href="@{/admin/statistics/traffic}">Trafic</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:classappend="${active == 'activity'} ? 'active'"
           th:href="@{/admin/statistics/activity}">Activitate Admin</a>
    </li>
</ul>

<table th:fragment="appointmentsTable(appointments, emptyMessage, showStatus)" class="table table-striped table-hover align-middle">
    <thead>
    <tr>
        <th style="width: 3rem;" class="text-center">Nr.</th>
        <th>Client</th>
        <th>Serviciu</th>
        <th>Solicitat</th>
        <th th:if="${showStatus}">Stare</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="a, iterStat : ${appointments}">
        <td th:text="${iterStat.count}"></td>
        <td><a th:href="@{/admin/appointments/{id}(id=${a.id()})}" th:text="${a.clientName()}"></a></td>
        <td th:text="${a.serviceName()}"></td>
        <td th:text="${#temporals.format(a.requestedAt(), 'dd MMM yyyy, HH:mm')}"></td>
        <td th:if="${showStatus}">
            <span th:switch="${a.status().name()}">
                <span th:case="'PENDING'" class="badge bg-warning text-dark" th:text="${a.status().displayName}"></span>
                <span th:case="'CONFIRMED'" class="badge bg-success" th:text="${a.status().displayName}"></span>
                <span th:case="'CANCELLED'" class="badge bg-danger" th:text="${a.status().displayName}"></span>
                <span th:case="'COMPLETED'" class="badge bg-secondary" th:text="${a.status().displayName}"></span>
            </span>
        </td>
    </tr>
    <tr th:if="${appointments.isEmpty()}">
        <td th:colspan="${showStatus} ? 5 : 4" class="text-muted text-center py-4" th:text="${emptyMessage}"></td>
    </tr>
    </tbody>
</table>

<div th:fragment="appointmentsTimeline(appointments)" class="timeline-scroll">
    <table class="timeline-table">
        <tbody>
        <th:block th:each="hour, hourStat : ${#numbers.sequence(9, 16)}">
        <tr th:each="minute, minuteStat : ${#numbers.sequence(0, 1)}">
            <td class="timeline-hour-label"
                th:text="${#numbers.formatInteger(hour, 2)} + (${minute} == 0 ? ':00' : ':30')"></td>
            <td th:if="${hourStat.first and minuteStat.first}" rowspan="16" class="timeline-track">
                <div class="timeline-block"
                     th:each="a : ${appointments}"
                     th:if="${a.status.name() != 'CANCELLED'}"
                     th:with="startMin=${a.requestedAt.hour * 60 + a.requestedAt.minute}, endMin=${a.endedAt.hour * 60 + a.endedAt.minute}, backTarget='/admin/calendar?date=' + ${#temporals.format(a.requestedAt, 'yyyy-MM-dd')}"
                     th:style="|top: ${(startMin - 540) * 2}px; height: ${(endMin - startMin) * 2}px;|"
                     th:classappend="${'timeline-block-' + a.status.name().toLowerCase()}">
                    <a class="timeline-block-link" th:href="@{/admin/appointments/{id}(id=${a.id}, back=${backTarget})}">
                        <span class="timeline-block-header">
                            <span class="timeline-block-time"
                                  th:text="${#temporals.format(a.requestedAt, 'HH:mm')} + '-' + ${#temporals.format(a.endedAt, 'HH:mm')}"></span>
                            <span class="timeline-block-client" th:text="${a.clientName}"></span>
                        </span>
                        <span class="timeline-block-service" th:text="${a.serviceName}"></span>
                    </a>
                </div>
            </td>
        </tr>
        </th:block>
        </tbody>
    </table>
    <p th:if="${appointments.isEmpty()}" class="text-muted text-center py-4">Nu există programări pentru această dată.</p>
</div>

</body>
</html>
