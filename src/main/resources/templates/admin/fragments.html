<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | Notary Admin'">Notary Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<nav th:fragment="navbar" class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}">Notary Admin Panel</a>
        <ul class="navbar-nav flex-row me-auto">
            <li class="nav-item me-3">
                <a class="nav-link text-white" th:href="@{/admin/appointments}">Appointments</a>
            </li>
        </ul>
        <form th:action="@{/admin/logout}" method="post" class="d-flex align-items-center mb-0">
            <span class="navbar-text text-white me-3" sec:authentication="name">admin</span>
            <button type="submit" class="btn btn-outline-light btn-sm">Log Out</button>
        </form>
    </div>
</nav>

</body>
</html>
