<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Adaugă Programare', ~{::link})}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
</head>
<body>

<nav th:replace="~{admin/fragments :: navbar}"></nav>

<main class="container my-4" style="max-width: 640px;">
    <a th:href="@{/admin/appointments}" class="d-inline-block mb-3">&larr; Înapoi la programări</a>

    <h1 class="h3 mb-4">Adaugă Programare</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/admin/appointments/new}" th:object="${bookingRequest}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nume client</label>
                    <input type="text" class="form-control" th:field="*{clientName}"
                           th:classappend="${#fields.hasErrors('clientName')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefon</label>
                    <input type="text" class="form-control" th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Serviciu</label>
                    <select class="form-select" th:field="*{serviceId}"
                            th:classappend="${#fields.hasErrors('serviceId')} ? 'is-invalid'">
                        <option value="">Alege un serviciu...</option>
                        <option th:each="service : ${services}" th:value="${service.id()}" th:text="${service.name()}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('serviceId')}" th:errors="*{serviceId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dată</label>
                    <input type="text" id="requestedAtDate" class="form-control" autocomplete="off" placeholder="dd-Mon-yyyy"
                           th:value="${#temporals.format(selectedDate, 'yyyy-MM-dd')}"
                           th:classappend="${#fields.hasErrors('requestedAt') or #fields.hasErrors('requestedAtOnHalfHour')} ? 'is-invalid'"/>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('requestedAt')}" th:errors="*{requestedAt}"></div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('requestedAtOnHalfHour')}" th:errors="*{requestedAtOnHalfHour}"></div>
                </div>

                <div class="mb-3">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label">Ora început</label>
                            <select id="requestedAtTime" class="form-select">
                                <option value="">Alege ora...</option>
                                <option th:each="t : ${startTimeSlots}" th:value="${t}" th:text="${t}"
                                        th:disabled="${busyTimeSlots.startTimes().contains(t)}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ora sfârșit</label>
                            <select id="endTimeSelect" name="endTime" class="form-select">
                                <option value="">Alege ora...</option>
                                <option th:each="t : ${endTimeSlots}" th:value="${t}" th:text="${t}"
                                        th:selected="${selectedEndTime != null and t == selectedEndTime}"
                                        th:disabled="${busyTimeSlots.endTimes().contains(t) and t != selectedEndTime}"></option>
                            </select>
                        </div>
                    </div>
                    <small class="text-muted">Orele indisponibile (afișate estompat) se suprapun cu o programare deja confirmată.</small>
                    <input type="hidden" id="requestedAt" th:field="*{requestedAt}"/>
                </div>

                <div class="card mb-3">
                    <div class="card-header">Programări existente în ziua selectată</div>
                    <div class="card-body" id="dayTimelineContainer">
                        <div th:replace="~{admin/fragments :: appointmentsTimeline(${dayAppointments})}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Notă</label>
                    <textarea class="form-control" rows="3" th:field="*{notes}"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Creează programarea</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var hidden = document.getElementById('requestedAt');
        var dateInput = document.getElementById('requestedAtDate');
        var timeSelect = document.getElementById('requestedAtTime');
        var endTimeSelect = document.getElementById('endTimeSelect');
        var dayTimelineContainer = document.getElementById('dayTimelineContainer');

        function sync() {
            hidden.value = (dateInput.value && timeSelect.value) ? (dateInput.value + 'T' + timeSelect.value) : '';
        }

        if (hidden.value) {
            var parts = hidden.value.split('T');
            dateInput.value = parts[0];
            timeSelect.value = parts[1];
        }

        var applyDisabled = function (select, busyTimes) {
            Array.from(select.options).forEach(function (option) {
                var busy = busyTimes.indexOf(option.value) !== -1;
                // Never disable the currently selected option - a disabled+selected <option> is
                // silently dropped from form submission by the HTML spec, which would turn a
                // busy-but-already-chosen time into a missing required request parameter.
                option.disabled = busy && option.value !== select.value;
            });
        };

        var refreshDaySchedule = function () {
            if (!dateInput.value) {
                return;
            }
            var dateParam = encodeURIComponent(dateInput.value);

            fetch('/admin/appointments/new/busy-times?date=' + dateParam)
                .then(function (response) {
                    return response.ok ? response.json() : {startTimes: [], endTimes: []};
                })
                .then(function (busyTimeSlots) {
                    applyDisabled(timeSelect, busyTimeSlots.startTimes || []);
                    applyDisabled(endTimeSelect, busyTimeSlots.endTimes || []);
                })
                .catch(function () {
                    // Leave the previously rendered disabled state as-is if the request fails.
                });

            fetch('/admin/appointments/new/day-schedule?date=' + dateParam)
                .then(function (response) {
                    return response.ok ? response.text() : null;
                })
                .then(function (html) {
                    if (html !== null) {
                        dayTimelineContainer.innerHTML = html;
                    }
                })
                .catch(function () {
                    // Leave the previously rendered timeline as-is if the request fails.
                });
        };

        flatpickr(dateInput, {
            altInput: true,
            altFormat: 'd-M-Y',
            dateFormat: 'Y-m-d',
            onChange: function () {
                sync();
                refreshDaySchedule();
            }
        });
        timeSelect.addEventListener('change', sync);
    });
</script>
</body>
</html>
