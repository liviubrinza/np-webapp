<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Programări', null)}"></head>
<body>

<nav th:replace="~{admin/fragments :: navbar}"></nav>

<main class="container my-4">
    <h1 class="h3 mb-4">Programări</h1>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <div class="card bg-light mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/admin/appointments}" class="row g-2 align-items-end">
                <div class="col-auto">
                    <label class="form-label mb-0"><b>Nume</b></label>
                    <input type="text" name="name" class="form-control form-control-sm" placeholder="Numele clientului"
                           th:value="${name}"/>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0" id="statusFilterLabel"><b>Stare</b></label>
                    <div class="dropdown">
                        <button type="button" class="btn btn-outline-secondary btn-sm dropdown-toggle" id="statusFilterToggle"
                                data-bs-toggle="dropdown" aria-expanded="false" aria-labelledby="statusFilterLabel"
                                th:text="${statusFilterLabel}">Toate</button>
                        <ul class="dropdown-menu p-2" style="min-width: 220px;">
                            <li>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="statusAll"
                                           th:checked="${selectedStatuses.isEmpty()}"/>
                                    <label class="form-check-label" for="statusAll">Toate</label>
                                </div>
                            </li>
                            <li><hr class="dropdown-divider"/></li>
                            <li th:each="s : ${statuses}">
                                <div class="form-check">
                                    <input class="form-check-input status-option" type="checkbox" name="status"
                                           th:value="${s}" th:id="${'status-' + s}"
                                           th:checked="${selectedStatuses.contains(s)}"/>
                                    <label class="form-check-label" th:for="${'status-' + s}" th:text="${s.displayName}"></label>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0"><b>De la</b></label>
                    <input type="date" name="from" class="form-control form-control-sm" th:value="${from}"/>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0"><b>Până la</b></label>
                    <input type="date" name="to" class="form-control form-control-sm" th:value="${to}"/>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-sm">Filtrează</button>
                    <a th:href="@{/admin/appointments}" class="btn btn-outline-secondary btn-sm">Resetează</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header"><b>În așteptare</b></div>
        <div class="card-body">
            <div th:replace="~{admin/fragments :: appointmentsTable(${pendingAppointments}, 'Nu există programări în așteptare.', false)}"></div>
            <div class="text-end">
                <a th:href="@{/admin/appointments/new}" class="btn btn-primary btn-sm">+ Adaugă programare</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><b>Confirmate / Anulate / Finalizate</b></div>
        <div class="card-body">
            <div th:replace="~{admin/fragments :: appointmentsTable(${otherAppointments}, 'Nicio altă programare nu corespunde acestor filtre.', true)}"></div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var allCheckbox = document.getElementById('statusAll');
        var optionCheckboxes = document.querySelectorAll('.status-option');

        allCheckbox.addEventListener('change', function () {
            if (allCheckbox.checked) {
                optionCheckboxes.forEach(function (cb) {
                    cb.checked = false;
                });
            }
        });

        optionCheckboxes.forEach(function (cb) {
            cb.addEventListener('change', function () {
                var anyChecked = Array.from(optionCheckboxes).some(function (c) {
                    return c.checked;
                });
                allCheckbox.checked = !anyChecked;
            });
        });
    })();
</script>
</body>
</html>
