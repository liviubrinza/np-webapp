<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Appointment Detail')}"></head>
<body>

<nav th:replace="~{admin/fragments :: navbar}"></nav>

<main class="container my-4" style="max-width: 720px;">
    <a th:href="@{/admin/appointments}" class="d-inline-block mb-3">&larr; Back to appointments</a>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <h1 class="h3 mb-4" th:text="${appointment.clientName()}">Client Name</h1>

    <dl class="row">
        <dt class="col-sm-3">Email</dt>
        <dd class="col-sm-9" th:text="${appointment.email()}"></dd>

        <dt class="col-sm-3">Phone</dt>
        <dd class="col-sm-9" th:text="${appointment.phone()}"></dd>

        <dt class="col-sm-3">Service</dt>
        <dd class="col-sm-9" th:text="${appointment.serviceName()}"></dd>

        <dt class="col-sm-3">Requested</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(appointment.requestedAt(), 'dd MMM yyyy, HH:mm')}"></dd>

        <dt class="col-sm-3">Submitted</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(appointment.createdAt(), 'dd MMM yyyy, HH:mm')}"></dd>

        <dt class="col-sm-3">Client's message</dt>
        <dd class="col-sm-9" th:text="${appointment.notes() ?: '—'}"></dd>
    </dl>

    <hr/>

    <form th:action="@{/admin/appointments/{id}/status(id=${appointment.id()})}" method="post"
          class="row g-2 align-items-end mb-4">
        <div class="col-auto">
            <label class="form-label mb-0">Status</label>
            <select name="status" class="form-select">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == appointment.status()}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Update Status</button>
        </div>
    </form>

    <form th:action="@{/admin/appointments/{id}/notes(id=${appointment.id()})}" method="post">
        <div class="mb-3">
            <label class="form-label">Internal Notes</label>
            <textarea name="internalNotes" class="form-control" rows="4" th:text="${appointment.internalNotes()}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Notes</button>
    </form>
</main>

</body>
</html>
