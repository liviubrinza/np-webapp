spring:
  application:
    name: np-webapp
  profiles:
    active: h2
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB
  # Real values come from either application-local-dev.yml (local dev, gitignored - see that
  # file) or the SMTP_* env vars under the docker profile. The bracketed placeholders below are
  # never meant to work as-is - they're a visible reminder that this needs to be configured.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:{REAL_ACCOUNT_NAME}}
    password: ${SMTP_PASSWORD:{REAL_ACCOUNT_PASSWORD}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO

app:
  # TODO: replace with the real production domain before deploy. Used to build absolute
  # canonical/hreflang URLs and the sitemap.xml/robots.txt Sitemap: line.
  base-url: "https://example.com"
  storage:
    documents-dir: ./persistent
  logging:
    dir: ./logs
  mail:
    # Off by default so a stock checkout never tries to send real email. Enabled explicitly
    # either via application-local-dev.yml (see that file) for local development, or via the
    # MAIL_ENABLED env var under the docker profile.
    enabled: false
    from: "{REAL_ACCOUNT_NAME}"
  demo-data:
    appointments:
      enabled: true
  # TODO: replace the address/hours placeholders with real values before deploy. These feed both
  # the Contact page display and the LegalService/OpeningHoursSpecification structured data
  # (StructuredDataService) - days-of-week must be kept in sync by hand with the separately
  # translated contact.schedule.days label in messages_*.properties.
  contact:
    street: "Stejarului nr.50"
    city: "Floresti"
    postal-code: "407280"
    country-code: "RO"
    phone: "0777 777 777"
    email: "something@somethingelse.com"
    opening-time: "09:00"
    closing-time: "18:00"
    days-of-week: [ Monday, Tuesday, Wednesday, Thursday, Friday ]
    latitude: 46.72982564167728
    longitude: 23.48734642212008

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/np-webapp;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:np_webapp}
    username: ${DB_USERNAME:np_webapp}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    documents-dir: ${STORAGE_DOCUMENTS_DIR:/data/persistent}
  logging:
    dir: ${LOGGING_DIR:/data/logs}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:{REAL_ACCOUNT_NAME}}
