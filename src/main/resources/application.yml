spring:
  application:
    name: np-webapp
  profiles:
    active: h2
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

logging:
  level:
    root: INFO

app:
  storage:
    documents-dir: ./persistent
  logging:
    dir: ./logs
  demo-data:
    appointments:
      enabled: true
  contact:
    address: "To be added later"
    phone: "0777 777 777"
    email: "something@somethingelse.com"
    hours: "09:00 - 18:00"
    latitude: 46.72982564167728
    longitude: 23.48734642212008

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/np-webapp;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:np_webapp}
    username: ${DB_USERNAME:np_webapp}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    documents-dir: ${STORAGE_DOCUMENTS_DIR:/data/persistent}
  logging:
    dir: ${LOGGING_DIR:/data/logs}
