spring:
  application:
    name: np-webapp
  profiles:
    active: h2
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  storage:
    documents-dir: ./storage/documents

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/np-webapp;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:np_webapp}
    username: ${DB_USERNAME:np_webapp}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    documents-dir: ${STORAGE_DOCUMENTS_DIR:/data/documents}
