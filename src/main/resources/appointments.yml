# Demo/test appointment data, loaded when app.demo-data.appointments.enabled is true
# (see application.yml). Loaded by AppointmentDemoDataSeeder on startup, skipped if the
# appointments table already has rows - re-enabling the flag will not duplicate entries.
#
# Every detail of an appointment is configurable here, independently of the linked service:
# `booked-service` only matches a Service by its stable `code` (see services.yml) for display/
# categorization - `duration` (minutes) is its own field and drives `ended-at` off `requested-for`.
# `booked-date` is the appointment's created-at timestamp (when the booking was made), separate
# from `requested-for` (the actual appointment slot). `status` accepts any AppointmentStatus value.
#
# The set exists to make every scenario reachable by hand in each month, so these properties are
# deliberate - keep them if you edit the data:
#  * Every month from August 2026 through February 2027 has appointments; none is empty.
#  * 2-4 days per month are fully booked back-to-back 09:00-18:00 with no gaps (each day's
#    durations sum to exactly 540 minutes), so the admin calendar paints them red. A CANCELLED
#    appointment must never sit inside such a day - monthAvailability ignores cancelled rows, so
#    it would open a gap and the day would fall back to partially booked.
#  * Every month also has partially booked days (amber) and untouched weekdays (green).
#  * All four statuses appear in every month (at least two of each), as do all six services.
#  * Every appointment is on a weekday inside 09:00-18:00 and no two overlap - the booking form
#    rejects weekends and the app treats overlapping CONFIRMED appointments as an error state.
# Fully booked days: 7/18/25 August 2026; 2/16/29 September 2026; 5/12/21/28 October 2026;
#   12/18 November 2026; 2/14/24 December 2026; 7/14/28 January 2027; 4/16 February 2027.
