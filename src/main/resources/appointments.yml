# Demo/test appointment data, loaded when app.demo-data.appointments.enabled is true
# (see application.yml). Loaded by AppointmentDemoDataSeeder on startup, skipped if the
# appointments table already has rows - re-enabling the flag will not duplicate entries.
#
# Every detail of an appointment is configurable here, independently of the linked service:
# `booked-service` only matches a Service by its stable `code` (see services.yml) for display/
# categorization - `duration` (minutes) is its own field and drives `ended-at` off `requested-at`.
# `booked-date` is the appointment's created-at timestamp (when the booking was made), separate
# from `requested-at` (the actual appointment slot). `status` accepts any AppointmentStatus value.
#
# Several days are deliberately fully booked back-to-back from 09:00 to 18:00 with no gaps (each
# block's durations sum to exactly 540 minutes) so the admin calendar shows them red - keep that
# invariant if you edit them. Currently: 3/5/18 August (below), 8/15/22 September (below), plus
# 8/15/22 May, 2/10/18 June, and 6/14/22 July in the historical section further down.
